<style>
  :root{
    --bg:#0e1013; --surface:#161a20; --surface-2:#1d222a;
    --border:#272e39; --text:#e9edf2; --muted:#93a0b0;
    --yellow:#ffd406; --yellow-hover:#ffe14d; --telegram:#2aabee;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);line-height:1.5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px}

  /* HEADER */
  header{border-bottom:1px solid var(--border);background:rgba(14,16,19,.85);backdrop-filter:blur(10px);position:sticky;top:0;z-index:50}
  .header-inner{display:flex;align-items:center;justify-content:space-between;height:64px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem;letter-spacing:-.02em}
  .logo-mark{width:40px;height:40px;border-radius:10px;overflow:hidden;display:grid;place-items:center;color:#111;font-weight:900;flex-shrink:0}
  .logo-mark img{width:100%;height:100%;object-fit:cover;display:block}
  .logo-mark .logo-letter{display:none}
  .logo-mark.fallback{background:var(--yellow)}
  .logo-mark.fallback .logo-letter{display:block}
  .logo span{color:var(--yellow)}

  /* BUTTONS */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    padding:13px 24px;border:none;border-radius:11px;
    font-size:.95rem;font-weight:700;font-family:inherit;
    text-decoration:none;cursor:pointer;white-space:nowrap;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:active{transform:translateY(1px)}
  .btn svg{width:18px;height:18px;flex-shrink:0}

  .btn-download{background:var(--yellow);color:#111;box-shadow:0 6px 20px rgba(255,212,0,.22)}
  .btn-download:hover{background:var(--yellow-hover);transform:translateY(-2px);box-shadow:0 10px 26px rgba(255,212,0,.3)}

  .btn-download:disabled{cursor:wait;transform:none;box-shadow:0 6px 20px rgba(255,212,0,.22)}
  .btn-download:disabled:hover{background:var(--yellow);transform:none}

  .btn-telegram{background:var(--telegram);color:#fff;box-shadow:0 6px 20px rgba(42,171,238,.25)}
  .btn-telegram:hover{background:#3fb6f2;transform:translateY(-2px);box-shadow:0 10px 26px rgba(42,171,238,.35)}

  .btn-sm{padding:9px 16px;font-size:.85rem;border-radius:9px}
  .btn-sm svg{width:15px;height:15px}

  /* PLAYER */
  main{padding:30px 0 60px}
  .player-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
  .player-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000}
  .player-wrap video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
  .player-info{padding:22px 24px 26px}

  .badge{
    display:inline-block;background:rgba(255,212,0,.12);color:var(--yellow);
    font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    padding:5px 10px;border-radius:6px;margin-bottom:12px;
  }
  h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
  .meta{color:var(--muted);font-size:.9rem;margin-bottom:22px}

  .actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .hint{color:var(--muted);font-size:.82rem;margin-top:16px}

  /* SUGGESTIONS */
  .section-head{margin:44px 0 18px}
  .section-head h2{font-size:1.2rem;font-weight:800;letter-spacing:-.01em}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}

  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    overflow:hidden;cursor:pointer;
    transition:transform .16s ease, border-color .16s ease, background .16s ease;
  }
  .card:hover{transform:translateY(-3px);border-color:#3a4350;background:var(--surface-2)}
  .card.active{border-color:var(--yellow);box-shadow:0 0 0 1px var(--yellow)}

  .thumb{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#232a34,#161a20);overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s ease}
  .card:hover .thumb img{transform:scale(1.05)}
  .duration{
    position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.78);color:#fff;
    font-size:.72rem;font-weight:700;padding:3px 7px;border-radius:5px;
  }
  .card-body{padding:12px 13px 14px}
  .card-title{
    font-size:.9rem;font-weight:700;line-height:1.35;margin-bottom:5px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card-sub{color:var(--muted);font-size:.78rem}

  footer{border-top:1px solid var(--border);padding:26px 0;color:var(--muted);font-size:.84rem;text-align:center}

  /* TOAST */
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
    background:var(--yellow);color:#111;font-weight:700;font-size:.88rem;
    padding:12px 22px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.45);
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:100;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* MOBILE */
  @media (max-width:640px){
    .logo{font-size:1rem}
    .player-info{padding:18px}
    h1{font-size:1.2rem}
    .actions{flex-direction:column;align-items:stretch}
    .btn{width:100%}
    .grid{grid-template-columns:1fr;gap:14px}
  }
</style>

<script>

   2. Paste that link between the quotes after  src:

   ========================================================================== */


/* ------------------------------------------------------------------
   🎬 VIDEO #1 — THE MAIN VIDEO (the big player at the top)
   ------------------------------------------------------------------ */
const MAIN_VIDEO = {
  title: "he took my viginity🥺",
  type:  "Video",
  duration: "2:27",
  

  // 👇 PASTE YOUR VIDEO LINK HERE 👇
  src:   "https://pub-3dfc857e90964d85be53eb7dcc5c14fa.r2.dev/100101_1790882572279.mp4",

  // 👇 PASTE YOUR THUMBNAIL IMAGE LINK HERE 👇
  thumb: "https://pub-3dfc857e90964d85be53eb7dcc5c14fa.r2.dev/Screenshot_20260930-081146_1.png"
};


/* ------------------------------------------------------------------
   🎬 VIDEOS #2, #3, #4 — THE 3 SUGGESTIONS AT THE BOTTOM
   (Keep exactly 3, or add more if you want — just copy the block)
   ------------------------------------------------------------------ */
const SUGGESTIONS = [

  {
    title: "mia khalipha-she fucked a fan boy",
    duration: "2:19",

    src:   "https://pub-3dfc857e90964d85be53eb7dcc5c14fa.r2.dev/100301_1791020147001.mp4",   // 👈 YOUR VIDEO LINK
    thumb: "https://pub-3dfc857e90964d85be53eb7dcc5c14fa.r2.dev/AI%20Ultra%20HD_044444db-97e3-33d7-aaaf-d71282531a5c.png"       // 👈 YOUR IMAGE LINK
  },

  {
    title: "what a pain",
  
    duration: "0:50",

    src:   "https://pub-3dfc857e90964d85be53eb7dcc5c14fa.r2.dev/100302_1791022616088.mp4",           // 👈 YOUR VIDEO LINK
    thumb: "https://pub-3dfc857e90964d85be53eb7dcc5c14fa.r2.dev/snapshot_1791022569615_040fd82f-f353-4b99-8d8f-f48a1da7080b.png"               // 👈 YOUR IMAGE LINK
  },

  {
    title: "Somewhere between falling and dreaming",
    
    duration: "1:00",
  
    src:   "https://pub-3dfc857e90964d85be53eb7dcc5c14fa.r2.dev/100303_1791027220791.mp4",     // 👈 YOUR VIDEO LINK
    thumb : "https://pub-3dfc857e90964d85be53eb7dcc5c14fa.r2.dev/snapshot_1791027316933_5bcd48ca-2529-400d-a221-47882c4ef206.jpg"         // 👈 YOUR IMAGE LINK
  }

];

/* ==========================================================================
   ⬆️⬆️⬆️  STOP EDITING HERE — the rest works automatically  ⬆️⬆️⬆️
   ========================================================================== */


/* ---------- Elements ---------- */
const player      = document.getElementById('player');
const titleEl     = document.getElementById('videoTitle');
const metaEl      = document.getElementById('videoMeta');
const downloadBtn = document.getElementById('downloadBtn');
const grid        = document.getElementById('grid');
const toast       = document.getElementById('toast');


/* ---------- State ---------- */
let current     = MAIN_VIDEO;          // video playing in the big player
let suggestions = [...SUGGESTIONS];    // videos shown in the bottom list


/* ---------- Build the suggestion cards ---------- */
function renderSuggestions(){
  grid.innerHTML = '';
  suggestions.forEach(v => {
    const card = document.createElement('article');
    card.className = 'card';
    card.innerHTML = `
      <div class="thumb">
        <img src="${v.thumb}" alt="${v.title}" loading="lazy" onerror="this.style.display='none'">
        <span class="duration">${v.duration}</span>
      </div>
      <div class="card-body">
        <div class="card-title">${v.title}</div>
        <div class="card-sub">${v.type}${v.size ? " • " + v.size : ""}</div>
      </div>`;
    card.addEventListener('click', () => switchTo(v));
    grid.appendChild(card);
  });
}


/* ---------- Switch video: the old one goes back into the list at a random spot ---------- */
function switchTo(v){
  const previous = current;
  suggestions = suggestions.filter(s => s !== v);                 // remove the clicked one
  const pos = Math.floor(Math.random() * (suggestions.length + 1));
  suggestions.splice(pos, 0, previous);                           // insert the old one randomly
  current = v;
  playVideo(v);
  renderSuggestions();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}


/* ---------- Load a video into the player ---------- */
function playVideo(v){
  player.src    = v.src;
  player.poster = v.thumb;
  player.load();

  titleEl.textContent = v.title;
  metaEl.textContent  = `${v.type} • ${v.duration}${v.size ? " • " + v.size : ""}`;

  resetDownload();   // cancel any running countdown when the video changes

  document.title = v.title + ' — xtres';
}


/* ---------- Download with a 6-second countdown ---------- */
const COUNTDOWN_SECONDS = 10;                       // 👈 change the wait time here
const dlLabel = document.getElementById('dlLabel');
let toastTimer, countdownTimer, downloading = false;

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
}

function resetDownload(){
  clearInterval(countdownTimer);
  downloading = false;
  downloadBtn.disabled = false;
  dlLabel.textContent = 'Download';
}

downloadBtn.addEventListener('click', () => {
  if (downloading) return;
  downloading = true;
  downloadBtn.disabled = true;

  const target = current;                          // the video that was on screen when clicked
  let left = COUNTDOWN_SECONDS;
  dlLabel.textContent = `Download starts in ${left}s…`;

  countdownTimer = setInterval(() => {
    left--;
    if (left > 0){
      dlLabel.textContent = `Download starts in ${left}s…`;
    } else {
      clearInterval(countdownTimer);
      dlLabel.textContent = 'Downloading…';
      saveVideo(target).finally(() => { if (current === target) resetDownload(); });
    }
  }, 1000);
});

/* Fetch the file and save it as a blob so the browser downloads it
   instead of opening/playing it. */
async function saveVideo(v){
  const name = (v.title.replace(/[^\p{L}\p{N} _-]+/gu, '').trim().replace(/\s+/g, '_') || 'video') + '.mp4';
  showToast('Starting your download…');
  try{
    const res = await fetch(v.src);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    triggerSave(url, name, false);
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }catch(err){
    // Host blocks direct fetching (CORS) → fall back to a normal link in a new tab
    triggerSave(v.src, name, true);
  }
}

function triggerSave(href, name, newTab){
  const a = document.createElement('a');
  a.href = href;
  a.download = name;
  if (newTab){ a.target = '_blank'; a.rel = 'noopener'; }
  document.body.appendChild(a);
  a.click();
  a.remove();
}


/* ---------- Start with the main video ---------- */
renderSuggestions();
playVideo(MAIN_VIDEO);
</script>
